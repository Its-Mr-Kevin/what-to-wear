<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What to wear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2830;--paper:#f1f5f7;--line:#d3dde3;--muted:#55666f;--row:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef2;--paper:#12191e;--line:#2a3640;--muted:#9aaab5;--row:#1a2329}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.4}
header,main,footer{max-width:42rem;margin:0 auto;padding:1rem}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:.5rem 0 1rem}
.tools{display:flex;flex-wrap:wrap;gap:.5rem}
.search{position:relative;flex:1 1 100%}
input,button{font:inherit;color:inherit;background:var(--row);border:1px solid var(--line);border-radius:.5rem;padding:.6rem .75rem}
input{width:100%}
button{cursor:pointer}
:focus-visible{outline:3px solid #3b82c4;outline-offset:2px}
.seg{display:flex}
.seg[hidden]{display:none}
.seg button{border-radius:0}
.seg button:first-child{border-radius:.5rem 0 0 .5rem}
.seg button:last-child{border-radius:0 .5rem .5rem 0;border-left:0}
.seg [aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#results{position:absolute;left:0;right:0;top:100%;margin:.25rem 0 0;padding:0;list-style:none;background:var(--row);border:1px solid var(--line);border-radius:.5rem;z-index:5;overflow:hidden}
#results li{padding:.65rem .75rem;cursor:pointer}
#results li:hover,#results li:focus{background:var(--paper)}
h2{font-size:1.1rem;font-weight:600;color:var(--muted);margin:.75rem 0 .5rem}
.day+.day{margin-top:1rem}
ol{list-style:none;margin:0;padding:0}
.row{background:var(--row);border-left:.5rem solid var(--c);border-bottom:1px solid var(--line)}
.head{display:grid;grid-template-columns:1fr auto;grid-template-areas:"time temp" "main main";gap:.5rem .75rem;align-items:center;width:100%;padding:.85rem .9rem;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:left}
button.head{cursor:pointer}
.row.first .head{padding-block:1.2rem}
.chev{display:block;margin:0 0 0 .25rem;width:1.25rem;height:1.25rem;fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.panel{display:flex;flex-wrap:wrap;gap:1rem 1.25rem;padding:.25rem .9rem 1.25rem}
.panel[hidden]{display:none}
.grp-t{margin:0 0 .5rem;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cards{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-start}
.panel>*{max-width:100%}
.card{width:4.75rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;font-size:.75rem;font-weight:600;line-height:1.25}
.tile{position:relative;width:4rem;height:4rem;border-radius:.9rem;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.tile svg{width:2.75rem;height:2.75rem;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-.4rem;left:-.4rem;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.or{align-self:flex-start;margin-top:1.4rem;font-size:.75rem;color:var(--muted)}
.time{grid-area:time;font-weight:600;font-size:1rem;white-space:nowrap}
.main{grid-area:main}
.layers{margin:0 0 .15rem;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.outfit{margin:0;font-size:1.1rem;font-weight:600}
.legs{margin:.15rem 0 0}
.extra{margin:.4rem 0 0;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:0 1rem;margin-top:.4rem;font-size:.875rem;color:var(--muted)}
.temp{grid-area:temp;display:flex;align-items:center;gap:.4rem;font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.temp small{font-size:.7rem;font-weight:400;letter-spacing:0;color:var(--muted)}
#list>p{color:var(--muted)}
footer{font-size:.8rem;color:var(--muted)}
footer a{color:inherit}
.warmth{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .75rem;font-size:.875rem;color:var(--muted)}
.warmth[hidden]{display:none}
.warmth input{flex:1 1 8rem;width:auto;min-width:8rem;height:2rem;padding:0;border:0;background:transparent;accent-color:var(--ink)}
.warmth output{flex:1 1 100%}
@media (min-width:900px){
  header,main,footer{max-width:68rem}
  #list{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem;align-items:start}
  .day+.day{margin-top:0}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-tshirt" viewBox="0 0 48 48"><path d="M16 8 L8 13 L12 20 L16 18 V40 H32 V18 L36 20 L40 13 L32 8 C31 11 28 13 24 13 C20 13 17 11 16 8 Z"/></symbol>

<symbol id="i-suncream" viewBox="0 0 48 48"><path d="M18 18 H30 V40 C30 41 29 42 28 42 H20 C19 42 18 41 18 40 Z M20 18 V12 H28 V18 M22 12 V8 H26 V12 M18 26 H30"/></symbol>
</defs></svg>
<header>
  <h1 id="place">Locating…</h1>
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="Search for a place" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results" aria-label="Search for a place">
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <button id="locate" type="button">Use my location</button>
    <button id="unit" type="button"></button>
    <div class="seg" id="modeSeg" role="group" aria-label="Mode">
      <button type="button" data-mode="casual">Casual</button>
      <button type="button" data-mode="school">School day</button>
    </div>
    <div class="seg" id="genderSeg" role="group" aria-label="Clothes for">
      <button type="button" data-gender="boys">Boys</button>
      <button type="button" data-gender="girls">Girls</button>
    </div>
    <div class="warmth" id="warmthRow">
      <span>Runs cold</span>
      <input id="warmth" type="range" min="-3" max="3" step="1" value="0" aria-label="How warm you run">
      <span>Runs hot</span>
      <output id="warmthNote" for="warmth"></output>
    </div>
  </div>
</header>
<main id="list" aria-live="polite"></main>
<footer>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a></footer>

<script>
/* ---------- Clothing rules ----------
   Bands are chosen by wind chill (°C). Edit this table to tune the advice. */
const WARMTH_STEP_C = 2;        // each slider step shifts the temperature used to pick the band
const UMBRELLA_CUTOFF_KT = 11;   // Beaufort force 4 and above: no umbrella
const WARM_LEGS = "thermals plus jeans or joggers (ski-trousers for play)";
const COLD_TOP = "Thermal base, jumper or hoodie, insulated coat; hat, mittens, scarf, boots";
const COLD_ICONS = {
  layers: ["thermal", "jumper", "insulatedcoat"], acc: ["hat", "mittens", "scarf", "boots"], accTitle: "Wear",
  boys: [["thermallegs", "jeans"], ["thermallegs", "joggers"], ["skitrousers"]],
  girls: [["thermallegs", "jeans"], ["thermallegs", "joggers"], ["skitrousers"]],
};
const bands = [
  { below: -20, layers: 4, note: "limit time outside", top: COLD_TOP, boys: WARM_LEGS, girls: WARM_LEGS, icons: COLD_ICONS },
  { below: -5,  layers: 4, top: COLD_TOP, boys: WARM_LEGS, girls: WARM_LEGS, icons: COLD_ICONS },
  { below: 5,   layers: 3, note: "plus accessories",
    top: "Top, jumper or hoodie, winter coat; hat, gloves, warm socks",
    boys: "jeans or joggers over thermals", girls: "thermal tights or leggings under jeans or joggers",
    icons: { layers: ["top", "jumper", "wintercoat"], acc: ["hat", "gloves", "socks"], accTitle: "Wear",
      boys: [["thermallegs", "jeans"], ["thermallegs", "joggers"]],
      girls: [["thermaltights", "jeans"], ["thermaltights", "joggers"]] } },
  { below: 12,  layers: 3,
    top: "Top, jumper or hoodie, warm coat; hat and gloves in a pocket",
    boys: "jeans or joggers", girls: "jeans or leggings; thick tights under a skirt or dress",
    icons: { layers: ["top", "jumper", "warmcoat"], acc: ["hat", "gloves"], accTitle: "In a pocket",
      boys: [["jeans"], ["joggers"]], girls: [["jeans"], ["leggings"], ["thicktights", "skirtdress"]] } },
  { below: 18,  layers: 2,
    top: "T-shirt plus jumper or hoodie, or a light coat",
    boys: "joggers or jeans", girls: "joggers or leggings; tights under a skirt or dress",
    icons: { layers: ["tshirt", ["jumper", "lightcoat"]], acc: [],
      boys: [["joggers"], ["jeans"]], girls: [["joggers"], ["leggings"], ["tights", "skirtdress"]] } },
  { below: 24,  layers: 1, note: "plus a spare",
    top: "T-shirt; light layer in the bag",
    boys: "shorts or joggers", girls: "shorts, joggers, skirt or dress",
    icons: { layers: ["tshirt"], acc: ["spare"], accTitle: "In the bag",
      boys: [["shorts"], ["joggers"]], girls: [["shorts"], ["joggers"], ["skirtdress"]] } },
  { below: Infinity, layers: 1, top: "T-shirt", boys: "shorts", girls: "shorts, skirt or dress",
    icons: { layers: ["tshirt"], acc: [], boys: [["shorts"]], girls: [["shorts"], ["skirtdress"]] } },
];

/* Icon for each item: [symbol in the sprite, label] */
const ITEM = {
  top: ["tshirt", "Top"], tshirt: ["tshirt", "T-shirt"], jumper: ["jumper", "Jumper or hoodie"],
  thermal: ["jumper", "Thermal base"], spare: ["jumper", "Light layer"],
  lightcoat: ["coat", "Light coat"], warmcoat: ["coat", "Warm coat"], wintercoat: ["coat", "Winter coat"],
  insulatedcoat: ["coat", "Insulated coat"], wcoat: ["coat", "Waterproof coat"],
  hat: ["beanie", "Hat"], gloves: ["glove", "Gloves"], mittens: ["mitten", "Mittens"], scarf: ["scarf", "Scarf"],
  socks: ["socks", "Warm socks"], boots: ["boot", "Boots"],
  shorts: ["shorts", "Shorts"], joggers: ["joggers", "Joggers"], jeans: ["jeans", "Jeans"],
  leggings: ["leggings", "Leggings"], tights: ["leggings", "Tights"], thicktights: ["leggings", "Thick tights"],
  thermaltights: ["leggings", "Thermal tights or leggings"], thermallegs: ["leggings", "Thermals"],
  skirtdress: ["skirt", "Skirt or dress"], skitrousers: ["jeans", "Ski-trousers for play"],
  umbrella: ["umbrella", "Umbrella"], wellies: ["welly", "Wellies"],
  sunhat: ["sunhat", "Sun hat"], suncream: ["suncream", "Suncream"], snowboots: ["boot", "Waterproof boots"],
};

/* Celsius wind chill; valid at 10°C or below with wind above 4.8 km/h,
   otherwise the air temperature is used as it is. */
function windChill(tC, windKt) {
  const v = windKt * 1.852;
  if (tC > 10 || v <= 4.8) return tC;
  const p = Math.pow(v, 0.16);
  return 13.12 + 0.6215 * tC - 11.37 * p + 0.3965 * tC * p;
}

function advise(b, mode, gender) {
  const windy = b.windKt >= UMBRELLA_CUTOFF_KT;
  const rain = b.rainChance >= 40
    ? (windy ? "Waterproof coat" : "Waterproof coat, or an umbrella") : null;
  const ex = [];   // icon groups for the extras
  if (rain) ex.push({ title: "If it rains", alts: windy ? [["wcoat"]] : [["wcoat"], ["umbrella"]] });
  if (mode === "school") return { school: true, extras: rain ? [rain] : [], ex };

  const band = bands.find((x) => b.windChill + warmth * WARMTH_STEP_C < x.below);
  const extras = [];
  if (rain) extras.push(rain);
  if (b.rainChance >= 70) { extras.push("Waterproof shoes or wellies"); ex.push({ title: "Feet", alts: [["wellies"]] }); }
  if (b.isDay && b.uv >= 6) { extras.push("Sun hat, suncream"); ex.push({ title: "Sun", alts: [["sunhat", "suncream"]] }); }
  if (b.snow) { extras.push("Waterproof boots"); ex.push({ title: "Snow", alts: [["snowboots"]] }); }
  return { band, legs: band[gender], extras, ex };
}

/* ---------- Forecast: fixed 3-hour blocks, now through end of tomorrow ---------- */
async function getBlocks(lat, lon) {
  const url = "https://api.open-meteo.com/v1/forecast" +
    `?latitude=${lat}&longitude=${lon}` +
    "&hourly=temperature_2m,precipitation_probability,wind_speed_10m,uv_index,is_day,snowfall" +
    "&wind_speed_unit=kn&timezone=auto&forecast_days=2";
  const res = await fetch(url);
  if (!res.ok) throw new Error("Forecast request failed");
  const data = await res.json();
  const h = data.hourly;

  const nowLocal = new Date(Date.now() + data.utc_offset_seconds * 1000)
    .toISOString().slice(0, 16);
  const today = nowLocal.slice(0, 10);
  const tm = new Date(today + "T00:00:00Z");
  tm.setUTCDate(tm.getUTCDate() + 1);
  const tomorrowStr = tm.toISOString().slice(0, 10);
  const nowHourStr = nowLocal.slice(0, 13);

  const groups = {};
  h.time.forEach((t, i) => {
    const date = t.slice(0, 10);
    const hour = parseInt(t.slice(11, 13), 10);
    const start = hour - (hour % 3);
    const key = date + "T" + String(start).padStart(2, "0");
    if (t.slice(0, 13) < nowHourStr || date > tomorrowStr) return;
    (groups[key] ??= { date, start, rows: [] }).rows.push(i);
  });

  const pad = (n) => String(n).padStart(2, "0");
  return Object.entries(groups).sort().map(([, g], idx) => {
    const pick = (arr) => g.rows.map((i) => arr[i] ?? 0);
    const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const temps = pick(h.temperature_2m), winds = pick(h.wind_speed_10m);
    const end = (g.start + 3) % 24;
    return {
      day: g.date === today ? "Today" : "Tomorrow",
      label: idx === 0 ? `Now–${pad(end)}:00` : `${pad(g.start)}:00–${pad(end)}:00`,
      airTemp: avg(temps),
      windChill: avg(temps.map((t, k) => windChill(t, winds[k]))),
      windKt: Math.max(...winds),
      rainChance: Math.max(...pick(h.precipitation_probability)),
      uv: Math.max(...pick(h.uv_index)),
      isDay: pick(h.is_day).some((d) => d === 1),
      snow: pick(h.snowfall).some((s) => s > 0),
    };
  });
}

/* ---------- Rendering and settings ---------- */
const $list = document.getElementById("list");
const $place = document.getElementById("place");
const $unit = document.getElementById("unit");
const $warmth = document.getElementById("warmth"), $warmthNote = document.getElementById("warmthNote");
let unit = "C", mode = "casual", gender = "boys", warmth = 0, lastBlocks = [];
try {
  unit = localStorage.getItem("unit") === "F" ? "F" : "C";
  mode = localStorage.getItem("mode") === "school" ? "school" : "casual";
  gender = localStorage.getItem("gender") === "girls" ? "girls" : "boys";
  warmth = Math.max(-3, Math.min(3, parseInt(localStorage.getItem("warmth"), 10) || 0));
} catch {}

function tempColor(c) {
  return c < 0 ? "#2f5d8a" : c < 10 ? "#4f86b5" : c < 18 ? "#5fa38b" : c < 24 ? "#d9a441" : "#d4623a";
}
function deg(c) { return (unit === "F" ? Math.round(c * 9 / 5 + 32) : Math.round(c)) + "°"; }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function card(id, badge) {
  const [sym, label] = ITEM[id];
  const c = el("div", "card");
  const tile = el("div", "tile");
  tile.innerHTML = `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${sym}"/></svg>`;
  if (badge) tile.append(el("span", "badge", String(badge)));
  c.append(tile, el("span", null, label));
  return c;
}
function plain(ids) {
  const w = el("div", "cards");
  ids.forEach((id) => w.append(card(id)));
  return w;
}
/* groups = alternatives; items inside a group are worn together */
function alts(groups, badge) {
  const w = el("div", "cards");
  groups.forEach((g, gi) => {
    if (gi) w.append(el("span", "or", "or"));
    g.forEach((id, k) => { if (k) w.append(el("span", "or", "+")); w.append(card(id, badge)); });
  });
  return w;
}
function section(title, node) {
  const s = el("div");
  s.append(el("p", "grp-t", title), node);
  return s;
}
function buildPanel(a) {
  const panel = el("div", "panel");
  panel.hidden = true;
  if (!a.school) {
    const ic = a.band.icons, layers = el("div", "cards");
    ic.layers.forEach((entry, n) =>
      layers.append(alts(Array.isArray(entry) ? entry.map((x) => [x]) : [[entry]], n + 1)));
    panel.append(section("Layers, inner to outer", layers));
    if (ic.acc.length) panel.append(section(ic.accTitle, plain(ic.acc)));
    panel.append(section(`Legs, ${gender}`, alts(ic[gender])));
  }
  a.ex.forEach((e) => panel.append(section(e.title, alts(e.alts))));
  return panel;
}
function closeAll() {
  $list.querySelectorAll('.head[aria-expanded="true"]').forEach((h) => {
    h.setAttribute("aria-expanded", "false");
    h.nextElementSibling.hidden = true;
  });
}

function renderBlocks(blocks) {
  lastBlocks = blocks;
  $list.replaceChildren();
  let day = null, ol = null;
  blocks.forEach((b, i) => {
    if (b.day !== day) {
      day = b.day;
      const section = el("section", "day");
      section.append(el("h2", null, day));
      ol = el("ol");
      section.append(ol);
      $list.append(section);
    }
    const a = advise(b, mode, gender);
    const panel = buildPanel(a);
    const hasPanel = panel.childElementCount > 0;
    const li = el("li", "row" + (i === 0 ? " first" : ""));
    li.style.setProperty("--c", tempColor(b.windChill));

    const head = el(hasPanel ? "button" : "div", "head");
    head.append(el("div", "time", b.label));

    const main = el("div", "main");
    if (a.school) {
      main.append(el("p", "outfit", a.extras.length ? a.extras[0] : "Normal school clothes"));
    } else {
      const n = a.band.layers;
      main.append(el("p", "layers", `${n} layer${n > 1 ? "s" : ""}${a.band.note ? ", " + a.band.note : ""}`));
      main.append(el("p", "outfit", a.band.top));
      main.append(el("p", "legs", "Legs: " + a.legs));
      if (a.extras.length) main.append(el("p", "extra", a.extras.join(". ") + "."));
    }
    const meta = el("div", "meta");
    meta.append(el("span", null, `Rain ${b.rainChance}%`), el("span", null, `Wind ${Math.round(b.windKt)} kt`));
    if (!a.school) meta.append(el("span", null, `Wind chill ${deg(b.windChill)}`));
    main.append(meta);

    const temp = el("div", "temp", deg(b.airTemp));
    temp.append(el("small", null, "air temp"));
    if (hasPanel) {
      temp.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 48 48" aria-hidden="true"><path d="M12 18 L24 30 L36 18"/></svg>');
      head.type = "button";
      head.setAttribute("aria-expanded", "false");
      head.addEventListener("click", () => {
        const wasOpen = head.getAttribute("aria-expanded") === "true";
        closeAll();                                   // only one block open at a time
        if (!wasOpen) { panel.hidden = false; head.setAttribute("aria-expanded", "true"); }
      });
    }
    head.append(main, temp);
    li.append(head);
    if (hasPanel) li.append(panel);
    ol.append(li);
  });
}

function syncControls() {
  $unit.textContent = "°" + unit;
  $unit.setAttribute("aria-label", `Temperatures in °${unit}. Switch to °${unit === "C" ? "F" : "C"}`);
  document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.mode === mode));
  document.querySelectorAll("[data-gender]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.gender === gender));
  document.getElementById("genderSeg").hidden = mode === "school";
  document.getElementById("warmthRow").hidden = mode === "school";
  $warmth.value = warmth;
  const t = Math.round((unit === "F" ? 1.8 : 1) * WARMTH_STEP_C * Math.abs(warmth)), u = "°" + unit;
  const note = warmth === 0 ? "Typical: no adjustment"
    : warmth < 0 ? `Runs cold: dressing as if it were ${t}${u} colder`
    : `Runs hot: dressing as if it were ${t}${u} warmer`;
  $warmthNote.textContent = note;
  $warmth.setAttribute("aria-valuetext", note);
}
function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
function refresh() { syncControls(); if (lastBlocks.length) renderBlocks(lastBlocks); }

$unit.addEventListener("click", () => { unit = unit === "C" ? "F" : "C"; save("unit", unit); refresh(); });
document.querySelectorAll("[data-mode]").forEach((x) =>
  x.addEventListener("click", () => { mode = x.dataset.mode; save("mode", mode); refresh(); }));
document.querySelectorAll("[data-gender]").forEach((x) =>
  x.addEventListener("click", () => { gender = x.dataset.gender; save("gender", gender); refresh(); }));
$warmth.addEventListener("input", () => { warmth = parseInt($warmth.value, 10); save("warmth", warmth); refresh(); });
syncControls();

/* ---------- Location: device first, plus place search with autocomplete ---------- */
async function loadLocation(lat, lon, name) {
  $place.textContent = name;
  $list.textContent = "Loading forecast…";
  try {
    renderBlocks(await getBlocks(lat, lon));
  } catch {
    $list.textContent = "Couldn't load the forecast. Check your connection and try again.";
  }
}

function useDeviceLocation() {
  if (!navigator.geolocation) return showSearchPrompt();
  $place.textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(
    (pos) => loadLocation(pos.coords.latitude, pos.coords.longitude, "Your location"),
    showSearchPrompt,
    { timeout: 10000, maximumAge: 10 * 60 * 1000 }
  );
}
function showSearchPrompt() {
  $place.textContent = "Search for a place";
  $list.textContent = "Location is off or unavailable. Search for a place to see what to wear.";
  $q.focus();
}
document.getElementById("locate").addEventListener("click", useDeviceLocation);

const $q = document.getElementById("q");
const $results = document.getElementById("results");
let timer, latest = 0;

$q.addEventListener("input", () => {
  clearTimeout(timer);
  const text = $q.value.trim();
  if (text.length < 2) return closeResults();
  timer = setTimeout(() => search(text), 250);
});

async function search(text) {
  const id = ++latest;
  const url = "https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=" +
              encodeURIComponent(text);
  try {
    const data = await (await fetch(url)).json();
    if (id !== latest) return;
    showResults(data.results || []);
  } catch { closeResults(); }
}

function showResults(list) {
  $results.replaceChildren();
  if (!list.length) $results.append(el("li", null, "No matches"));
  list.forEach((r) => {
    const label = [r.name, r.admin1, r.country].filter(Boolean).join(", ");
    const li = el("li", null, label);
    li.setAttribute("role", "option");
    li.tabIndex = 0;
    const pick = () => { $q.value = ""; closeResults(); loadLocation(r.latitude, r.longitude, label); };
    li.addEventListener("click", pick);
    li.addEventListener("keydown", (e) => { if (e.key === "Enter") pick(); });
    $results.append(li);
  });
  $results.hidden = false;
  $q.setAttribute("aria-expanded", "true");
}
function closeResults() {
  $results.hidden = true;
  $q.setAttribute("aria-expanded", "false");
}
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) closeResults(); });

useDeviceLocation();
</script>
